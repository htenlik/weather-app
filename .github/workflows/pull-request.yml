name: Pull Request

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - 'release/**'
      - 'katilimci/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Format (ktlint)
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  # Release derlemesi (R8 + kaynak küçültme) ayrı işte: doğrulama işi hızlı kalır, APK indirilebilir artefakt olur.
  release-build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # keystore.properties repoda olmadığı için release APK debug anahtarıyla imzalanır (bkz. README).
      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hava-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
